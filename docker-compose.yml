services:

  postgres:
    image: postgres:17
    container_name: system_components_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: system_components
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: system_components_adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  minio:
    container_name: minio_storage
    build: .
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data: