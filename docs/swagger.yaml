basePath: /
definitions:
  ds.Component:
    properties:
      description:
        type: string
      grouping:
        type: string
      id:
        type: integer
      image_url:
        type: string
      name:
        type: string
      priority:
        type: integer
      video_url:
        type: string
    type: object
  ds.ComponentFeedSerializer:
    properties:
      description:
        type: string
      grouping:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_creator:
        type: integer
      is_liked:
        type: integer
      likes_count:
        type: integer
      name:
        type: string
      priority:
        type: integer
      video_url:
        type: string
    type: object
  ds.ComponentGridSerializer:
    properties:
      description:
        type: string
      grouping:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_creator:
        type: integer
      likes_count:
        type: integer
      name:
        type: string
      priority:
        type: integer
      video_url:
        type: string
    type: object
  ds.LikeRequest:
    properties:
      like:
        type: integer
    type: object
  ds.PublishComponentRequest:
    properties:
      description:
        type: string
      grouping:
        type: string
      priority:
        type: integer
    required:
    - description
    - grouping
    - priority
    type: object
  ds.User:
    properties:
      id:
        type: integer
      login:
        type: string
    type: object
  ds.UserAuthRequest:
    properties:
      login:
        example: creator_dev
        type: string
      password:
        example: secret_password1
        type: string
    required:
    - login
    - password
    type: object
  ds.UserLoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/ds.User'
    type: object
host: localhost:8080
info:
  contact: {}
  description: Веб-сервис расчета времени отклика веб-приложения (system_components)
  title: System Components API
  version: "1.0"
paths:
  /api/system-components:
    get:
      description: Доступно без авторизации и с авторизацией. Возвращает список компонентов
        с фильтрацией по слою.
      parameters:
      - description: Фильтр по архитектурному слою (Бэкенд, Кэш, БД)
        in: query
        name: grouping
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ds.ComponentGridSerializer'
            type: array
      summary: Получение списка опубликованных услуг (каталог)
      tags:
      - SystemComponents
    post:
      consumes:
      - multipart/form-data
      description: Создает черновик с автозаполнением создателя из JWT и загружает
        картинку и видео в MinIO
      parameters:
      - description: Название компонента
        in: formData
        name: name
        required: true
        type: string
      - description: Изображение компонента
        in: formData
        name: image
        type: file
      - description: Демонстрационное видео
        in: formData
        name: video
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ds.Component'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Добавление новой услуги (создание черновика)
      tags:
      - SystemComponents
  /api/system-components/{id}:
    delete:
      description: Переводит статус компонента в deleted (только для авторизованного
        создателя)
      parameters:
      - description: ID компонента
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Мягкое удаление услуги создателем
      tags:
      - SystemComponents
    put:
      consumes:
      - application/json
      description: Переводит черновик в статус published и обновляет поля описания,
        группировки и приоритета
      parameters:
      - description: ID черновика компонента
        in: path
        name: id
        required: true
        type: integer
      - description: Поля публикации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.PublishComponentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.Component'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Публикация черновика услуги
      tags:
      - SystemComponents
  /api/system-components/{id}/like:
    post:
      consumes:
      - application/json
      description: Ставит (1) или убирает (0) лайк от имени авторизованного пользователя
      parameters:
      - description: ID компонента
        in: path
        name: id
        required: true
        type: integer
      - description: Значение лайка (0 или 1)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.LikeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Постановка или отмена лайка
      tags:
      - SystemComponents
  /api/system-components/draft:
    get:
      description: Возвращает поля черновика текущего авторизованного создателя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.Component'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получение активного черновика пользователя
      tags:
      - SystemComponents
  /api/system-components/feed:
    get:
      description: Возвращает карточку ленты (первую без параметров или следующую
        по ?id=1&next=true)
      parameters:
      - description: Текущий ID компонента
        in: query
        name: id
        type: integer
      - description: Флаг перехода к следующей записи
        in: query
        name: next
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.ComponentFeedSerializer'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получение одной карточки для ленты
      tags:
      - SystemComponents
  /api/users/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин/пароль, возвращает JWT-токен, устанавливает Cookie
        и записывает сессию в Redis
      parameters:
      - description: Учетные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.UserAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ds.UserLoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Аутентификация пользователя
      tags:
      - Users
  /api/users/logout:
    post:
      description: Добавляет текущий JWT-токен в Blacklist Redis и очищает куку
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Деавторизация пользователя (Logout)
      tags:
      - Users
  /api/users/register:
    post:
      consumes:
      - application/json
      description: Создает нового пользователя в БД с хешированием пароля
      parameters:
      - description: Данные регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ds.UserAuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ds.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация нового пользователя
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer <ваш_jwt_токен>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
